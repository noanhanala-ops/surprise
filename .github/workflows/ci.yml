name: CI
on:
  pull_request: {}
  push: { branches: [main, 'claude/**'] }
  workflow_dispatch: {}
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    env: { DATABASE_URL: "postgres://postgres:ci@localhost:5432/postgres" }
    steps:
      - uses: actions/checkout@v4
      - run: database/migrate.sh --seed
      - run: psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f database/tests/invariants.sql
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml && python3 scripts/check_openapi.py
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    env: { DATABASE_URL: "postgres://postgres:ci@localhost:5432/postgres" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: database/migrate.sh --seed
      - run: npm ci
      - run: npm run build -w @drp/contracts
      - working-directory: apps/api
        run: npx tsc --noEmit && npx jest --runInBand
  infra:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: "postgres://postgres:ci@localhost:5432/postgres"
      REDIS_URL: "redis://localhost:6379"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672"
      S3_ENDPOINT: "http://localhost:9000"
      AWS_ACCESS_KEY_ID: drp
      AWS_SECRET_ACCESS_KEY: drp_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: MinIO
        run: |
          # imagem oficial no quay.io (o Docker Hub deixou de ter versões recentes de minio/minio)
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=drp -e MINIO_ROOT_PASSWORD=drp_dev_only quay.io/minio/minio server /data
          for i in $(seq 1 30); do curl -sf localhost:9000/minio/health/live && exit 0; sleep 1; done
          echo '::error::MinIO não arrancou'; docker ps -a; docker logs minio; exit 1
      - run: database/migrate.sh --seed
      - run: npm ci
      - run: npm run build -w @drp/contracts
      - run: npm run test:infra -w @drp/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck -w @drp/web
      - run: npm run build -w @drp/web
        env: { API_URL: "http://localhost:3001" }
  e2e-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: "postgres://postgres:ci@localhost:5432/postgres"
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234567
      SANDBOX_MODE: "true"
      API_URL: "http://localhost:3001"
      # os E2E registam dezenas de utilizadores do mesmo IP: sobe os limites (o default protege produção)
      RATE_REGISTER_IP: "100000"
      RATE_LOGIN_IP: "100000"
      RATE_LOGIN_FAILS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: database/migrate.sh --seed
      - run: npm ci
      - run: npm run build -w @drp/contracts && npm run build -w @drp/api && npm run build -w @drp/web
      - name: Arrancar API e web
        run: |
          (cd apps/api && PORT=3001 node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web/storefront && npm start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:3001/v1/health && curl -sf localhost:3000/ -o /dev/null && break; sleep 1; done
      - run: npm run seed:demo -w @drp/api
      - name: Chromium (Playwright; não fica nas dependências do projecto)
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run e2e:web
      - if: failure()
        run: tail -n 50 /tmp/api.log /tmp/web.log
